<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maestros Services GBP Cover</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.95), transparent 36%),
          radial-gradient(circle at 82% 44%, rgba(255, 255, 255, 0.45), transparent 28%),
          linear-gradient(135deg, #f8f8f5 0%, #eeeeea 58%, #d9d9d3 100%);
        color: #111;
        font-family: Arial, Helvetica, sans-serif;
      }

      .frame {
        position: absolute;
        inset: 42px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 430px;
        align-items: center;
        gap: 82px;
        padding: 76px 82px;
        border: 2px solid rgba(255, 255, 255, 0.92);
        border-radius: 66px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.16);
      }

      .copy {
        max-width: 900px;
      }

      .name {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 86px;
        line-height: 0.96;
        letter-spacing: -3px;
      }

      .eyebrow {
        margin: 34px 0 0;
        color: #343434;
        font-size: 23px;
        letter-spacing: 8px;
      }

      .services {
        width: fit-content;
        max-width: 820px;
        margin: 52px 0 0;
        padding: 32px 38px;
        border: 1px solid rgba(17, 17, 17, 0.08);
        border-radius: 34px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.06);
        font-size: 37px;
        font-weight: 800;
        line-height: 1.28;
      }

      .cta {
        display: inline-flex;
        margin-top: 46px;
        padding: 20px 36px;
        border-radius: 999px;
        background: linear-gradient(135deg, #151515, #050505);
        color: #fff;
        box-shadow: 0 18px 38px rgba(0, 0, 0, 0.16);
        font-size: 24px;
        font-weight: 800;
      }

      .area {
        margin-top: 24px;
        color: #484848;
        font-size: 27px;
      }

      .mark-wrap {
        display: grid;
        place-items: center;
        width: 430px;
        height: 430px;
        border: 28px solid #070707;
        border-radius: 999px;
        background: radial-gradient(circle at 50% 38%, #ffffff 0 52%, #efefeb 100%);
        box-shadow: 0 24px 54px rgba(0, 0, 0, 0.18);
      }

      .mark {
        width: 318px;
        height: auto;
        transform: translateY(-4px);
        filter: contrast(1.34) brightness(0.82) saturate(0) drop-shadow(0 14px 16px rgba(0, 0, 0, 0.16));
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <section class="copy">
        <h1 class="name">Maestros Services</h1>
        <p class="eyebrow">RESIDENTIAL LANDSCAPING</p>
        <p class="services">Cleanups, power washing, driveway grading, mulch refreshes, and minor fence work.</p>
        <div class="cta">Call or text 250-858-1781</div>
        <p class="area">Lower-mid Vancouver Island</p>
      </section>
      <section class="mark-wrap" aria-label="Maestros Services lotus logo">
        <img class="mark" src="../../public/logo.png" alt="Maestros Services lotus logo" />
      </section>
    </main>
  </body>
</html>
