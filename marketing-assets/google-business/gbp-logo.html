<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maestros Services GBP Logo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 36%, #ffffff 0 32%, #f4f4f1 58%, #deded8 100%);
        font-family: Arial, Helvetica, sans-serif;
      }

      .badge {
        position: relative;
        display: grid;
        place-items: center;
        width: 850px;
        height: 850px;
        border: 36px solid #070707;
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 36%, #ffffff 0 46%, #f5f5f2 76%, #e7e7e1 100%);
        box-shadow: 0 28px 58px rgba(0, 0, 0, 0.18);
      }

      .logo {
        width: 618px;
        height: auto;
        transform: translateY(-8px);
        filter: contrast(1.34) brightness(0.82) saturate(0) drop-shadow(0 16px 16px rgba(0, 0, 0, 0.16));
      }
    </style>
  </head>
  <body>
    <main class="badge" aria-label="Maestros Services lotus logo">
      <img class="logo" src="../../public/logo.png" alt="Maestros Services lotus logo" />
    </main>
  </body>
</html>
